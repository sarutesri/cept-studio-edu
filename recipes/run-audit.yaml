# run-audit -- check evidence that already exists. Runs no solver.
#
# A recipe v2 document is a list of steps. Each step names a registered operation
# and the inputs it reads; the owner, the outputs and what happens on failure come
# from the registry. Read it with:
#
#     cept run --recipe run-audit --explain
#
schema: workflow-recipe-v2
id: run-audit
version: 1.0.0
title: Read-only audit over persisted run evidence and a typed Case

description: >-
  Verifies one run directory against its own stored artifacts, audits that same
  directory, checks one Case's declared per-unit and kV bases, inventories the run
  directories under an explicit root, and writes the completion receipt.

needs:
  run_dir:
    type: string
  case:
    type: file
  audit_root:
    type: directory

steps:
  - verify.study run_dir
  - audit.physics run_dir
  - audit.perunit case run_dir
  - audit.artifacts audit_root run_dir
  - write.receipt

must_produce:
  - validation_report.json
  - physics-audit.json
  - per-unit-audit.json
  - artifacts-audit.json

limits:
  - >-
    This workflow audits persisted evidence and runs no solver. A run directory
    that does not already hold its own artifact set fails verification before any
    audit runs; the recipe never manufactures the evidence it is asked to audit.
  - >-
    A passing physics audit is not engineering validation. It checks that the run's
    quantities are finite, identified and internally consistent. It does not
    re-solve the system, does not compare against a reference, and does not
    establish cross-engine or project agreement. See
    src/cept/verification/audits/physics.py and src/cept/public.py:34.
  - >-
    The artifact inventory is read-only by construction. It reports where runs are,
    whether they sit inside the configured artifact root, and the sha256 of their
    bound evidence files. It performs no migration and treats "outside the
    configured root" as a reported fact, never as a deletion. See
    src/cept/application/operations/audit.py and src/cept/artifacts.py:9.
  - >-
    The per-unit audit reads one typed Case and checks the declared per-unit and kV
    bases against each other. It does not fetch a missing base, does not infer one
    from a neighbouring base, and does not widen a tolerance to make a Case
    consistent. See src/cept/fidelity/perunit.py.
