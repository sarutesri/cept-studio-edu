# release-qualification -- record what already-existing artifacts support.
#
# No claim is promoted when evidence is missing or blocked.
schema: workflow-recipe-v2
id: release-qualification
version: 1.0.0
title: Build a release-qualification record from artifacts that already exist

description: >-
  Names explicitly existing artifacts and records what they support. Nothing is
  promoted when evidence is missing or blocked.

needs:
  qualify_root:
    type: directory
  run_dir:
    type: string

steps:
  - verify.study run_dir
  - audit.physics run_dir
  - audit.release qualify_root run_dir
  - write.receipt

must_produce:
  - validation_report.json
  - physics-audit.json
  - release-qualification.json

limits:
  - >-
    A completed workflow is not engineering validation and not project
    validation. The claim ceiling is WORKFLOW_VALIDATED.
  - >-
    Every capability on the paid side is implemented behind a licensed
    PowerFactory session. This workflow does not reach one, so a release record it
    produces cannot speak to those capabilities.
