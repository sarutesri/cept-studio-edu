# report-preparation -- verify a run, then render its report and notebook.
#
# The shared tail of study-evidence. Included by name, so the two cannot drift.
schema: workflow-recipe-v2
id: report-preparation
version: 1.0.0
title: Verify a run, then render its report and notebook

description: >-
  Verifies one exact run directory, renders the HTML report, and assembles a
  notebook from the stored artifacts.

needs:
  run_dir:
    type: string

steps:
  - verify.study run_dir
  - render.report run_dir
  - assemble.notebook run_dir

must_produce:
  - validation_report.json
  - report.html
  - run-notebook.ipynb

limits:
  - >-
    Notebook assembly fails closed for any run whose stored engine is a licensed
    host, because representing such a run honestly would require that host's
    internals. A PowerFactory run therefore reaches report rendering and never
    reaches notebook assembly. See src/cept/reporting/notebook.py:83 and :325-329.
  - >-
    Only the plain notebook target is implemented. A declared Colab target raises
    instead of writing a notebook, because no Colab runtime, pinned dependency
    set, kernel behaviour or executed-notebook acceptance evidence exists in this
    repository. See src/cept/reporting/notebook.py:20-27 and :62.
