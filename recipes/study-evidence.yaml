# study-evidence -- from a typed Case to a verified run, report, notebook, receipt.
#
# This fragment verifies and prepares reports from an existing run.
#
#     cept run --recipe study-evidence --explain
#
schema: workflow-recipe-v2
id: study-evidence
version: 1.0.0
title: Study evidence, from typed Case to verified run, report, notebook and receipt

description: >-
  Takes one typed Case, checks its readiness, executes it through the single
  existing execution owner, verifies that exact run directory, optionally compares
  two solver leaves, then runs the shared tail and writes the receipt. It never
  edits the Case, never widens a tolerance and never promotes a claim.

needs:
  case:
    type: file
  run_dir:
    type: string
  lane:
    type: string
    default: usermodel
  powerfactory_run:
    type: string
    optional: true
  opendss_run:
    type: string
    optional: true
  comparison_out:
    type: string
    optional: true

steps:
  - check.case case
  - run.study case run_dir
  - verify.study run_dir
  - operation: compare.runs
    needs:
      case: case
      lane: lane
      powerfactory_run: powerfactory_run
      opendss_run: opendss_run
      out_dir: comparison_out
    on_failure: report-preparation
    reason: >-
      Comparison is optional. When the declared lane cannot execute, or the leaf
      directories are not usable, the workflow continues without a comparison and
      records the blocked state instead of inventing cross-engine agreement.
  - include: report-preparation.yaml
    needs: [run_dir]
  - write.receipt

must_produce:
  - case.json
  - results.json
  - manifest.json
  - execution-plan.json
  - attempt.json
  - identity-map.json
  - validation_report.json
  - validation_report.md
  - validation-record.json
  - report.html
  - sld-layout.json
  - sld-fidelity.json
  - sld_collision.json
  - source-identity.json
  - result-cache-use.json
  - command_log.txt
  - run-notebook.ipynb

limits:
  - >-
    A completed workflow is not engineering validation, not cross-engine
    agreement, and not project validation. It shows only that the declared
    operations ran in the declared order and produced their declared artifacts.
    The claim ceiling is WORKFLOW_VALIDATED. See src/cept/public.py:34,
    src/cept/application/execution.py:375 and src/cept/recipes/run_result.py.
  - >-
    PowerFactory is a licensed host. The comparison step cannot complete without
    an installed and licensed PowerFactory session; no licence ships with CEPT and
    this recipe cannot supply one. On a licence-free host that step records
    blocked and the workflow continues without it. See
    src/cept/adapters/pf/connection.py:108-133 and src/cept/cli/doctor.py:160-167.
  - >-
    Dynamics and EMT studies cannot be completed from anything this repository
    ships. The vendor controller models, initialisation data and event definitions
    such a study requires are absent, so the study stays unresolved rather than
    solved. See examples/data_center_interconnection/README.md:12-14.
  - >-
    The data-centre interconnection fixture is a load-flow demonstrator whose values
    are placeholders. Completing this workflow over it yields demonstrator evidence
    only. See examples/data_center_interconnection/README.md:1-6.
  - >-
    Every operation runs in process through cept.application.operations.*. The
    recipe therefore never depends on the public CLI grammar, and a grammar change
    cannot change what a recipe does. See src/cept/recipes/registry.py and
    src/cept/recipes/runner.py PYTHON_OPERATIONS.
  - >-
    The HTML report render operation has no standalone public verb. The report is
    written by the execution owner during the study run. See
    src/cept/application/artifacts.py:65 and src/cept/cli/registry.py:105-119.
