{% macro sld_block(dom_id, graph_json, caption) %}
<div class="sld-wrap" data-sld-geometry="v2" data-sld-presentation="engineering-light-v1">
  <style>
    .sld-wrap[data-sld-presentation="engineering-light-v1"] {background:#ffffff !important;border-color:#cbd5e1 !important;box-shadow:0 8px 24px rgba(15,23,42,.08) !important;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-toolbar {background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-toolbar .lbl,.sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-cap {color:#64748b !important;font-size: 12px !important;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-btn {background:#ffffff !important;color:#334155 !important;border:1px solid #cbd5e1 !important;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-btn:hover {background:#f1f5f9 !important;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-btn.active {background:#0b5cad !important;color:#ffffff !important;border-color:#0b5cad !important;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-status {display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:7px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;color:#475569;font-size:11px;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-status .chip {display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;background:#fff;border:1px solid #cbd5e1;font-weight:600;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-status .ok {border-color:#86efac;color:#166534;background:#f0fdf4;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-status .bad {border-color:#fecaca;color:#991b1b;background:#fef2f2;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-canvas {background-color:#ffffff !important;background-image:linear-gradient(rgba(15,23,42,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.012) 1px,transparent 1px) !important;background-size:20px 20px !important;border-color:#e2e8f0 !important;position:relative;overflow:hidden;min-height:360px;height:560px;width:100%;cursor:grab;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-canvas[data-sld-review-export="true"] {background-image:none !important;border-color:transparent !important;box-shadow:none !important;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-canvas:active {cursor:grabbing;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-legend {color:#334155 !important;padding:8px 14px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;}
    .sld-wrap[data-sld-presentation="engineering-light-v1"] .sld-legend .it {display:inline-flex;align-items:center;gap:4px;margin-right:8px;}
    .sld-tooltip {position:absolute;background:rgba(15,23,42,.94);color:#fff;padding:6px 10px;border-radius:4px;font-size:11.5px;pointer-events:none;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none;max-width:280px;line-height:1.4;}
    .cept-sld-svg {width:100%;height:100%;display:block;background:#fff;}
    .cept-sld-svg .sld-branch,.cept-sld-svg .sld-terminal-stem,.cept-sld-svg .sld-symbol-shape * {vector-effect:non-scaling-stroke;}
    .cept-sld-svg .sld-branch,.cept-sld-svg .sld-terminal-stem {stroke-linecap:round;stroke-linejoin:round;}
    .cept-sld-svg .sld-branch:hover {stroke:#0b5cad !important;stroke-width:3.2px !important;cursor:pointer;}
    .cept-sld-svg .sld-busbar:hover {fill:#0b5cad !important;cursor:pointer;filter:drop-shadow(0 0 2px rgba(11,92,173,.4));}
    .cept-sld-svg .sld-device:hover,.cept-sld-svg .sld-inline:hover {cursor:pointer;filter:drop-shadow(0 0 3px rgba(11,92,173,.6));}
  </style>
  <div class="sld-toolbar">
    <div class="grp"><span class="lbl">Bus</span><button class="sld-btn active" data-sld-set="node:v">Key voltage</button><button class="sld-btn" data-sld-set="node:phase">Per-phase</button><button class="sld-btn" data-sld-set="node:off">Off</button></div>

  </div>
  <div class="sld-status" id="{{ dom_id }}_status"></div>
  <div id="{{ dom_id }}" class="sld-canvas"><div id="{{ dom_id }}_tt" class="sld-tooltip"></div></div>
  <div class="sld-legend" id="{{ dom_id }}_legend"></div>

</div>
