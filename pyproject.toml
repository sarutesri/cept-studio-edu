[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cept-power-studio"
version = "0.2.0.dev0"
description = "Candidate public OpenDSS-first CEPT study workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CEPT" }]
dependencies = [
    "networkx>=3.0",
    "OpenDSSDirect.py>=0.9",
    "pydantic>=2.5",
    # The two shipped recipes are YAML documents and the HTML report is
    # Jinja2-rendered; plotly renders the report's inline figures. These are
    # runtime requirements of `cept run --recipe` / `cept report` now that
    # the recipe runtime ships in the free wheel.
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "plotly>=5.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "nbclient>=0.8",
    "nbconvert>=7.0",
    "nbformat>=5.9",
    "matplotlib>=3.7",
]

[project.scripts]
cept = "cept.public_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# Core only. `cept*` also matched `cept_advanced`, which must never be reachable
# from a public install even by accident; the public stage does not contain it,
# and this narrows the glob so a mistake there cannot package it.
include = ["cept", "cept.*"]


# Install the authoritative recipe files without maintaining package copies, so
# `python -m cept.recipes study-evidence|report-preparation` resolves them from
# the installed layout (share/cept/recipes) as well as a source checkout.
[tool.setuptools.data-files]
"share/cept/recipes" = ["recipes/study-evidence.yaml", "recipes/report-preparation.yaml", "recipes/run-audit.yaml", "recipes/release-qualification.yaml"]
"share/cept/schemas" = ["src/cept/schema/recipe-v2.schema.json"]

# The HTML report renderer (jinja2) loads its templates/static from the package.
[tool.setuptools.package-data]
"cept.reporting" = ["templates/*.html", "static/*.js"]
cept = [
    "engine_passports.json",
    "testsystems/ieee13/*.csv",
    "testsystems/ieee13/*.dss",
    "capability/*.json",
    "semantics/data/*.json",
    "templates/*.csv",
]
